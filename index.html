<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1215"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BRAMM TRX"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><title>BRAMM TRX TIMER</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f4f7f5;background:#0b1215}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:26px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:27px}h1{font-size:clamp(24px,6vw,34px);margin:5px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:#b6fb63;font-weight:800}.small{background:#263338;color:#fff;border:1px solid #415055;border-radius:12px;padding:14px 12px;font-size:15px;font-weight:650;cursor:pointer}.section{color:#aebcbe;font-size:13px;margin-bottom:9px}.panel{background:#152923;border:1px solid #34453c;border-radius:24px;padding:26px 14px 24px;text-align:center}.panel.rest{background:#27261b}.mode{font-size:13px;color:#b6fb63;letter-spacing:2px;font-weight:800}.rest .mode{color:#ffd47a}.clock{font-size:clamp(76px,21vw,120px);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-6px;line-height:1.3}.exercise{font-size:clamp(20px,5.8vw,27px);font-weight:750;min-height:64px;display:flex;align-items:center;justify-content:center}.next{color:#b8c8c2;font-size:14px}.track{height:7px;background:#34463f;border-radius:8px;overflow:hidden;margin-top:22px}.fill{height:100%;background:#b6fb63;width:0}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1}.actions .primary{flex:1.8;background:#b6fb63;color:#101811;font-weight:800;font-size:19px}.subhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:27px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.block{padding:16px 10px;background:#1b2529;color:#e5ece9;border:1px solid #354146;border-radius:13px;font-weight:700;text-align:left;min-height:82px;cursor:pointer;font-size:15px}.block.active{background:#25432c;color:#b6fb63;border-color:#b6fb63}.detail{font-size:12px;opacity:.7;margin-top:5px}.note{font-size:12px;line-height:1.6;color:#9baeb0;margin-top:25px}button:focus-visible{outline:3px solid #b6fb63;outline-offset:2px}@media(max-width:390px){main{padding:20px 12px 40px}.small{padding:12px 8px;font-size:13px}.clock{letter-spacing:-4px}}
</style></head><body><main><header><div><div class="eyebrow">INSTRUKTØR MODE</div><h1>BRAMM TRX TIMER</h1></div><button class="small" id="sound">🔊 Lyd til</button></header><div class="section" id="section"></div><div class="panel" id="panel"><div class="mode" id="mode">ARBEJDE</div><div class="clock" id="clock">00:40</div><div class="exercise" id="exercise">1. TRX Squat</div><div class="next" id="next"></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="actions"><button class="small" id="previous">◀ Forrige</button><button class="small primary" id="toggle">▶ Start</button><button class="small" id="forward">Næste ▶</button></div><div class="subhead"><strong>Hop direkte til en blok</strong><button class="small" id="reset">↺ Nulstil</button></div><div class="grid" id="blocks"></div><p class="note">Tip: Hold skærmen tændt, hvis du vil være sikker på at høre ding ved hvert skift. iOS kan sætte lyd på pause, når skærmen låses. Åbn appen med internet første gang, og test derefter flytilstand.</p></main><script>
const blocks=[{name:'Opvarmning',work:40,rest:20,rounds:1,ex:['TRX Squat','TRX Row – let','Reverse Lunges','Chest Press – let','Squat + lægløft','Side Lunges']},{name:'Blok 1 · Ben + træk',work:40,rest:20,rounds:3,ex:['TRX Squat','TRX Row','Reverse Lunges']},{name:'Blok 2 · Overkrop',work:40,rest:20,rounds:3,ex:['Chest Press','Biceps Curl','Triceps Extension']},{name:'Blok 3 · Puls',work:40,rest:20,rounds:3,ex:['Squat + Knee Drive','Side Lunges','Power Row']},{name:'Core',work:30,rest:20,rounds:2,ex:['TRX Plank','Mountain Climbers','Knee Tuck']},{name:'Udstrækning',work:60,rest:0,rounds:1,ex:['Hoftebøjer','Baglår','Bryst og skuldre']}];
const steps=[],starts=[];blocks.forEach((b,bi)=>{starts.push(steps.length);for(let r=0;r<b.rounds;r++)b.ex.forEach((e,ei)=>{steps.push({block:bi,title:bi===0?`${ei+1}. ${e}`:e,duration:b.work,kind:'work',round:r+1});if(b.rest&&!(bi===4&&r===0&&ei===b.ex.length-1))steps.push({block:bi,title:'Skift øvelse',duration:b.rest,kind:'rest',round:r+1,next:b.ex[(ei+1)%b.ex.length]});else if(bi===4&&r===0&&ei===b.ex.length-1)steps.push({block:bi,title:'Pause mellem core-runder',duration:40,kind:'rest',round:r+1,next:b.ex[0]})});if(bi<4)steps.push({block:bi,title:'Vis næste blok',duration:80,kind:'rest',round:0,next:blocks[bi+1].ex[0]})});
const $=id=>document.getElementById(id);let index=0,left=steps[0].duration,running=false,sound=true,deadline=0,ctx=null;const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;function audioReady(){try{const C=window.AudioContext||window.webkitAudioContext;if(C){ctx=ctx||new C();ctx.resume()}}catch(e){}}function beep(){if(!sound)return;try{audioReady();if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13)}catch(e){}}function jump(i){index=Math.max(0,Math.min(steps.length-1,i));left=steps[index].duration;running=false;render()}function render(){const s=steps[index],b=blocks[s.block];$('section').textContent=`${b.name.toUpperCase()} · ${s.round?`RUNDE ${s.round}/${b.rounds}`:'BLOKPAUSE'}`;$('panel').classList.toggle('rest',s.kind==='rest');$('mode').textContent=s.kind==='work'?'ARBEJDE':'PAUSE / SKIFT';$('clock').textContent=fmt(left);$('exercise').textContent=s.title;const n=steps.slice(index+1).find(x=>x.kind==='work');$('next').textContent='Næste: '+(s.next||n?.title||'Færdig');$('fill').style.width=(100*(1-left/s.duration))+'%';$('toggle').textContent=running?'Ⅱ Pause':`▶ ${left===s.duration?'Start':'Fortsæt'}`;$('sound').textContent=sound?'🔊 Lyd til':'🔇 Lyd fra';document.querySelectorAll('.block').forEach((el,i)=>el.classList.toggle('active',i===s.block))}function tick(){if(!running)return;const remain=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(remain!==left){left=remain;render()}if(remain===0){beep();if(index+1>=steps.length){running=false;render();return}index++;left=steps[index].duration;deadline=Date.now()+left*1000;render()}}$('toggle').onclick=()=>{if(running){left=Math.max(0,Math.ceil((deadline-Date.now())/1000));running=false}else{audioReady();beep();running=true;deadline=Date.now()+left*1000}render()};$('previous').onclick=()=>jump(index-1);$('forward').onclick=()=>jump(index+1);$('reset').onclick=()=>jump(0);$('sound').onclick=()=>{sound=!sound;render()};$('blocks').innerHTML=blocks.map((b,i)=>`<button class="block" data-i="${i}">${b.name}<div class="detail">${b.work}/${b.rest} sek. · ${b.rounds} runder</div></button>`).join('');document.querySelectorAll('.block').forEach(el=>el.onclick=()=>jump(starts[Number(el.dataset.i)]));render();setInterval(tick,100);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
